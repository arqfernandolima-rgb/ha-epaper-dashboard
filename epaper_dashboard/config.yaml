name: E-paper Dashboard
version: "0.7.2"
slug: epaper_dashboard
description: Draws the office e-paper dashboard and serves it to the ESP32 display
url: https://github.com/arqfernandolima-rgb/ha-epaper-dashboard
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:monitor-dashboard
panel_title: E-paper
ports:
  8090/tcp: 8090
ports_description:
  8090/tcp: "Frame for the display: http://<HA address>:8090/frame.epd"
options:
  stocks:
    - symbol: ADSK
      name: Autodesk
    - symbol: ZTS
      name: Zoetis
  calendars: []
  indoor_rooms: []
  quiet_hours_start: 0
  quiet_hours_end: 6
  steps_goal: 8000
  refresh_minutes: 5
  clock: true
  alerts_right_away: true
  garage_alerts: true
  garage_alert_minutes: 10
  hide_idle_hours: 3
  alerts: []
schema:
  stocks:
    - symbol: str
      name: str?
  calendars:
    - str
  indoor_rooms:
    - str
  quiet_hours_start: int(0,23)
  quiet_hours_end: int(0,23)
  steps_goal: int(500,100000)
  refresh_minutes: int(3,60)
  clock: bool
  alerts_right_away: bool
  garage_alerts: bool
  garage_alert_minutes: int(0,240)
  hide_idle_hours: int(1,48)
  alerts:
    - entity: str
      state: str
      text: str
  finnhub_api_key: password?
  snaptrade_client_id: str?
  snaptrade_consumer_key: password?
  weather_entity: str?
  claude_personal_name: str?
  indoor_temperature: str?
  indoor_humidity: str?
  indoor_voc: str?
  indoor_co2: str?
  printer: str?
  vehicle: str?
  packages: str?
  package_notifications: str?
  steps: str?
  sleep: str?
  resting_heart_rate: str?
