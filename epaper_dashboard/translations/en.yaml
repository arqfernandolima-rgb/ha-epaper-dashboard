configuration:
  stocks:
    name: Stocks
    description: Symbols to show, top to bottom, with an optional display name (e.g. SPY / S&P 500). Four or more switch to compact rows.
  calendars:
    name: Calendars
    description: Calendar entities to show (e.g. calendar.autodesk). Leave empty to use every calendar in Home Assistant.
  indoor_rooms:
    name: Indoor rooms
    description: Area names to show in Indoor air, top to bottom (e.g. Office, Kitchen); up to 3. In each area the sensor with the most readings leads, and anything it can't measure (like CO2) comes from other sensors in the same area. Leave empty to show every Airthings device.
  quiet_hours_start:
    name: Quiet hours start
    description: Hour (0-23) when the display stops changing. The last frame before it shows tomorrow.
  quiet_hours_end:
    name: Quiet hours end
    description: Hour (0-23) when updates resume.
  steps_goal:
    name: Daily steps goal
    description: Fills the steps bar in the Health widget.
  refresh_minutes:
    name: Refresh every (minutes)
    description: How often the screen updates, on round times (5 means :00, :05, :10 ...). Each update flashes the panel for about 21 seconds. 3 is the panel's minimum.
  clock:
    name: Flip clock
    description: Shows the time of each update in the Today column. With it on, every update happens; with it off, updates where nothing changed are skipped.
  alerts_right_away:
    name: Show new alerts right away
    description: A new alert (garage door, failed print) shows within 3 minutes instead of waiting for the next update.
  garage_alerts:
    name: Garage door alerts
    description: Red banner when a garage door (MyQ or any other) has been left open. Found automatically.
  garage_alert_minutes:
    name: Garage open for (minutes)
    description: How long a garage door has to stay open before the banner shows. 0 shows it right away.
  hide_idle_hours:
    name: Hide idle items after (hours)
    description: The You column shows Health always, plus only what's active. A Claude plan with no new usage, or a finished or failed print, leaves after this many hours.
  kitchen_refresh_minutes:
    name: Kitchen display refresh (minutes)
    description: How often the battery kitchen display (reTerminal E1001) wakes up on its own, on round times. Fewer wake-ups means longer battery life. It sleeps through quiet hours; its buttons always wake it.
  kitchen_quiet_start:
    name: Kitchen display sleeps from (hour)
    description: The kitchen display stops its own updates at this hour (default 22 = 10 PM). Its buttons still wake it.
  kitchen_quiet_end:
    name: Kitchen display wakes at (hour)
    description: First update of the morning (default 6 AM). It's a full, clean refresh.
  alerts:
    name: Alerts
    description: Red banners at the bottom of the Today column. Each one shows its text while the entity is in that state (e.g. cover.garage_door / open / Garage door open).
  finnhub_api_key:
    name: Finnhub API key
    description: Needed for stocks. Free at finnhub.io (sign up, copy the key from the dashboard). The free plan covers US stocks and ETFs but not indexes, so use SPY for the S&P 500.
  snaptrade_client_id:
    name: SnapTrade client ID (portfolio)
    description: From your free SnapTrade Personal account (snaptrade.com/personal), after connecting E*TRADE and Vanguard there. Adds a Portfolio row with your total and today's change.
  snaptrade_consumer_key:
    name: SnapTrade consumer key (portfolio)
    description: The secret key that goes with the client ID. Read-only access to your accounts.
  claude_personal_name:
    name: Personal Claude plan name (optional)
    description: Label for the personal plan in the Claude widget. Defaults to "Max".
  weather_entity:
    name: Backup weather entity (optional)
    description: Used when Open-Meteo doesn't answer. Defaults to Home Assistant's own forecast (weather.forecast_home).
  indoor_temperature:
    name: Indoor temperature entity (optional)
    description: Only needed if the Airthings sensor isn't found automatically.
  indoor_humidity:
    name: Indoor humidity entity (optional)
    description: Only needed if the Airthings sensor isn't found automatically.
  indoor_voc:
    name: Indoor VOC entity (optional)
    description: Only needed if the Airthings sensor isn't found automatically.
  indoor_co2:
    name: Indoor CO2 entity (optional)
    description: Only needed if your CO2 sensor isn't in the same area as the room's other sensors.
  printer:
    name: 3D printers (optional)
    description: Print status entities, comma-separated (e.g. sensor.h2c_print_status), if they aren't found automatically. Every Bambu Lab printer is found on its own; only ones printing (or just done) show.
  vehicle:
    name: Vehicle battery (optional)
    description: A car's state-of-charge sensor, comma-separated for two (e.g. sensor.r1t_battery_state_of_charge). Rivian (HACS) is found automatically, with its range and charging status.
  packages:
    name: Packages arriving entity (optional)
    description: A sensor whose number is packages arriving today, if Mail and Packages isn't installed.
  package_notifications:
    name: Phone notification sensor (optional)
    description: The companion app's Last notification sensor (e.g. sensor.pixel_9_last_notification), used for Nest package alerts. Found automatically.
  steps:
    name: Steps entity (optional)
    description: Daily steps sensor, if the Health Connect one isn't found automatically.
  sleep:
    name: Sleep entity (optional)
    description: Sleep duration sensor (minutes or hours).
  resting_heart_rate:
    name: Resting heart rate entity (optional)
    description: Resting heart rate sensor.
  kitchen_people:
    name: Kitchen display people (optional)
    description: "Who's who in your calendar events, as initial=names. The first person owns the calendars (their all-day events show as away). Example: F=Fernando; M=Mi,Milena; T=Tom; E=Mimi,Emilia"
  kitchen_shopping_list:
    name: Kitchen display to-do lists (optional)
    description: The to-do lists the house page shows, comma-separated (HA's shopping list, Microsoft To Do lists from the MS365 To Do integration ...). Lists with something on them get a line each. Default todo.shopping_list.
  kitchen_goodnight_script:
    name: Kitchen display good night script (optional)
    description: What holding the green button runs. Default script.good_night if you have one; otherwise every light goes off (not the 3D printers') and music pauses.
  kitchen_stay_awake:
    name: Kitchen display stay-awake switch (optional)
    description: A toggle helper that keeps the kitchen display awake (for firmware updates) while it's on. Default input_boolean.kitchen_display_stay_awake.
network:
  8090/tcp: Frames for the displays (http://<HA address>:8090/frame.epd and /kitchen.png)
